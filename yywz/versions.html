<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Buddy 版本记录</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --ink: #152033;
        --muted: #687386;
        --line: #e3e8f0;
        --accent: #2f6df6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main {
        width: min(820px, calc(100% - 32px));
        margin: 48px auto;
      }
      h1 { margin-bottom: 8px; font-size: 32px; }
      .subtitle { color: var(--muted); margin-bottom: 24px; }
      .panel {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .version {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .version:last-child { border-bottom: 0; }
      .version strong { font-size: 15px; }
      .version p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
      a {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #eef4ff; }
      @media (max-width: 600px) {
        main { margin: 28px auto; }
        .version { grid-template-columns: 1fr; gap: 8px; }
        .version a { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>English Buddy 版本记录</h1>
      <p class="subtitle">新版本不会再覆盖旧版页面，每个重要版本都有独立入口和 Git 标签。</p>
      <section class="panel">
        <div class="version">
          <strong>当前版本</strong>
          <div>
            <strong>58000 词 + 2623 篇文章文献</strong>
            <p>汽车专业英语、独立强化笔记、56,800 条短句朗读和压缩按需加载。</p>
          </div>
          <a href="./">进入当前版本</a>
        </div>
        <div class="version">
          <strong>v1 旧版</strong>
          <div>
            <strong>初代 English Buddy</strong>
            <p>保留早期 8000 词、基础笔记和初始 AI 学习界面。</p>
          </div>
          <a href="./versions/v1/">查看 v1 旧版</a>
        </div>
      </section>
    </main>
  </body>
</html>
